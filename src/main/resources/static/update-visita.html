<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar o Eliminar Visita</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="d-flex">

    <!-- MENÚ -->
    <div class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">
        <h4 class="mb-4">Menú</h4>
        <ul class="nav flex-column">
            <li class="nav-item mb-2"><a href="/index.html" class="nav-link text-white">Inicio</a></li>
            <li class="nav-item mb-2"><a href="/create-visita.html" class="nav-link text-white">Crear Equipo</a></li>
        </ul>
    </div>

    <div class="container p-4">

        <h2>Buscar Visita</h2>

        <div class="mb-3">
            <label>Buscar por No. Cuenta o RFC</label>
            <input id="buscarId" type="text" class="form-control" placeholder="Escribe el No. Cuenta o RFC">
        </div>

        <ul id="resultados" class="list-group mb-3" style="max-height:200px; overflow-y:auto;"></ul>

        <form id="form-update" style="display:none">

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <input type="text" class="form-control" id="descripcion">
            </div>

            <div class="mb-3">
                <label class="form-label">Ubicación</label>
                <input type="text" class="form-control" id="ubicacion">
            </div>

            <div class="mb-3">
                <label class="form-label">Código Inventario</label>
                <input type="text" class="form-control" id="codigoInventario">
            </div>

            <!-- SELECT ESTATUS -->
            <div class="mb-3">
                <label class="form-label">Estatus</label>
                <select id="estatusSelect" class="form-select"></select>
            </div>

            <!-- SELECT TIPO -->
            <div class="mb-3">
                <label class="form-label">Tipo de Equipo</label>
                <select id="tipoSelect" class="form-select"></select>
            </div>

            <button id="btnActualizar" type="button" class="btn btn-success">Actualizar</button>
            <button id="btnEliminar" type="button" class="btn btn-danger ms-2">Eliminar</button>

        </form>

        <div id="msg" class="mt-3"></div>
    </div>

<script>

let visitaActual = null;
const formUpdate = document.getElementById("form-update");
const resultados = document.getElementById("resultados");

const estatusSelect = document.getElementById("estatusSelect"); // cambiar
const tipoSelect = document.getElementById("tipoSelect"); // cambiar

async function cargarListas() { // cambiar
    const [r1, r2] = await Promise.all([
        fetch("/api/estatus"),
        fetch("/api/tipos-equipo")
    ]);

    const estatusArr = await r1.json();
    const tiposArr = await r2.json();

    llenarSelect(estatusSelect, estatusArr, "Selecciona estatus...");
    llenarSelect(tipoSelect, tiposArr, "Selecciona tipo...");
}

function llenarSelect(select, items, placeholder) {
    select.innerHTML = "";
    const opt0 = document.createElement("option");
    opt0.value = "";
    opt0.textContent = placeholder;
    select.appendChild(opt0);

    items.forEach(it => {
        const opt = document.createElement("option");
        opt.value = it.id;
        opt.textContent = it.nombre ?? it.descripcion ?? "Sin nombre";
        select.appendChild(opt);
    });
}

buscarId.addEventListener("input", async () => {
    const id = buscarId.value.trim();

    resultados.innerHTML = "";

    if (id.length < 2) return;

    const resp = await fetch(`/api/visitas/nocuenta-rfc?rfc=${encodeURIComponent(id)}`);
    if (!resp.ok) return;

    const lista = await resp.json();

    lista.forEach(vi => {
        const item = document.createElement("li");
        item.classList.add("list-group-item", "list-group-item-action");
        item.textContent = `${vi.noCuentaRFC} - ${vi.nombre}`;

        item.addEventListener("click", () => {
            cargarVisita(vi);
            resultados.innerHTML = "";
            buscarId.value = vi.noCuentaRFC;
        });

        resultados.appendChild(item);
    });
});

async function cargarVisita(visita) {
    visitaActual = visita;

    // Asegura que las listas estén listas
    await cargarListas();

    descripcion.value      = equipo.descripcion;
    ubicacion.value        = equipo.ubicacion;
    codigoInventario.value = equipo.codigoInventario;

    estatusSelect.value    = equipo.estatus.id;
    tipoSelect.value       = equipo.tipoEquipo.id;

    formUpdate.style.display = "block";
}

// Actualizar
btnActualizar.addEventListener("click", async () => {
    const id = visitaActual.id;

    const body = {
        descripcion: descripcion.value,
        ubicacion: ubicacion.value,
        codigoInventario: codigoInventario.value,
        estatusId: Number(estatusSelect.value),
        tipoEquipoId: Number(tipoSelect.value)
    };

    const resp = await fetch(`/api/equipos/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
    });

    msg.innerHTML = `<div class="alert alert-success">Equipo actualizado correctamente.</div>`;
});

// Eliminar
btnEliminar.addEventListener("click", async () => {
    const id = visitaActual.id;

    await fetch(`/api/equipos/${id}`, { method: "DELETE" });

    msg.innerHTML = `<div class="alert alert-warning">Equipo eliminado.</div>`;
    formUpdate.style.display = "none";
});

</script>

</body>
</html>
