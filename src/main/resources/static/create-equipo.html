<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Crear Equipo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex">

  <!-- SIDEBAR -->
  <div class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">
    <h4 class="mb-4">Menú</h4>
    <ul class="nav flex-column">
      <li class="nav-item mb-2"><a href="/index.html" class="nav-link text-white">Inicio</a></li>
      <li class="nav-item mb-2"><a href="/update-equipo.html" class="nav-link text-white">Editar / Eliminar</a></li>
    </ul>
  </div>

  <!-- CONTENIDO -->
  <div class="container p-4">
    <h2>Crear Equipo</h2>

    <form id="form-create" class="needs-validation" novalidate>
      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <input type="text" id="descripcion" class="form-control" minlength="5" maxlength="200" required>
        <div class="invalid-feedback">La descripción es obligatoria (mín 5 caracteres).</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Ubicación</label>
        <input type="text" id="ubicacion" class="form-control" minlength="5" maxlength="100" required>
        <div class="invalid-feedback">La ubicación es obligatoria (mín 5 caracteres).</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Código Inventario</label>
        <input type="text" id="codigoInventario" class="form-control" minlength="5" maxlength="50" required>
        <div class="invalid-feedback">El código es obligatorio (mín 5 caracteres).</div>
      </div>

      <!-- SELECT ESTATUS -->
      <div class="mb-3">
        <label class="form-label">Estatus</label>
        <select id="estatusSelect" class="form-select" required>
          <option value="">Cargando estatus...</option>
        </select>
        <div class="invalid-feedback">Selecciona un estatus.</div>
      </div>

      <!-- SELECT TIPO EQUIPO -->
      <div class="mb-3">
        <label class="form-label">Tipo de Equipo</label>
        <select id="tipoSelect" class="form-select" required>
          <option value="">Cargando tipos...</option>
        </select>
        <div class="invalid-feedback">Selecciona un tipo de equipo.</div>
      </div>

      <button id="btnGuardar" type="submit" class="btn btn-primary" disabled>Guardar</button>
    </form>

    <div id="msg" class="mt-3"></div>
  </div>

<script>
(async () => {
  const estatusUrl = "/api/estatus";         // <- ajusta si tu ruta es distinta
  const tiposUrl  = "/api/tipos-equipo";    // <- ajusta si tu ruta es distinta

  const estatusSelect = document.getElementById("estatusSelect");
  const tipoSelect = document.getElementById("tipoSelect");
  const btnGuardar = document.getElementById("btnGuardar");
  const msg = document.getElementById("msg");

  // Helper: llena un select con array de objetos {id, nombre}
  function fillSelect(selectEl, items, placeholder) {
    selectEl.innerHTML = "";
    const empty = document.createElement("option");
    empty.value = "";
    empty.text = placeholder;
    selectEl.appendChild(empty);
    items.forEach(it => {
      const opt = document.createElement("option");
      opt.value = it.id;
      // si el nombre viene en otro campo (p.e. 'descripcion'), cámbialo
      opt.text = it.nombre ?? it.descripcion ?? it.name ?? ("#"+it.id);
      selectEl.appendChild(opt);
    });
  }

  // Cargar datos de estatus y tipos en paralelo
  try {
    const [r1, r2] = await Promise.all([fetch(estatusUrl), fetch(tiposUrl)]);
    if (!r1.ok || !r2.ok) throw new Error("No fue posible cargar listas básicas.");

    const [estatusArr, tiposArr] = await Promise.all([r1.json(), r2.json()]);

    // Espera objetos con id y nombre; si tu API usa otros campos, mapea aquí.
    fillSelect(estatusSelect, estatusArr, "Selecciona estatus...");
    fillSelect(tipoSelect, tiposArr, "Selecciona tipo de equipo...");

    // Habilitar el botón cuando ambas listas ya están cargadas
    btnGuardar.disabled = false;
  } catch (err) {
    console.error(err);
    estatusSelect.innerHTML = `<option value="">Error al cargar</option>`;
    tipoSelect.innerHTML = `<option value="">Error al cargar</option>`;
    msg.innerHTML = `<div class="alert alert-danger">Error cargando estatus o tipos: ${err.message}</div>`;
  }

  // Validación Bootstrap simple
  const form = document.getElementById("form-create");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    form.classList.add('was-validated');
    if (!form.checkValidity()) return;

    const body = {
      descripcion: document.getElementById("descripcion").value.trim(),
      ubicacion: document.getElementById("ubicacion").value.trim(),
      codigoInventario: document.getElementById("codigoInventario").value.trim(),
      estatusId: Number(estatusSelect.value),
      tipoEquipoId: Number(tipoSelect.value)
    };

    try {
      btnGuardar.disabled = true;
      const resp = await fetch("/api/equipos", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });

      if (!resp.ok) {
        const text = await resp.text();
        throw new Error(text || "Error en el servidor");
      }

      const data = await resp.json();
      msg.innerHTML = `<div class="alert alert-success">Equipo creado correctamente (id: ${data.id ?? "N/E"}).</div>`;
      form.reset();
      form.classList.remove('was-validated');
    } catch (err) {
      console.error(err);
      msg.innerHTML = `<div class="alert alert-danger">No se pudo crear equipo: ${err.message}</div>`;
    } finally {
      btnGuardar.disabled = false;
    }
  });
})();
</script>

</body>
</html>
