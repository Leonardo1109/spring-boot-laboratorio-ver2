<div class="container-fluid">
    <div class="row">
        <div class="col-12">

            <div class="card shadow-sm p-4">

                <h2 class="mb-4">Crear Visitante</h2>

                <!-- primero post, despues de la peticion, redirigir a pantalla principal -->
                <form 
                    class="mt-3"
                    hx-post="/api/visitas"
                    hx-swap="none"
                    hx-on::after-request="
                        if (event.detail.successful && event.detail.elt === this) {
                            alert('Visitante creado correctamente');
                            htmx.ajax('GET', '/pantallas/visitas/editar', '#main-content');
                        }
                    "
                >

            
                    <!-- NO CUENTA / RFC -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">No. Cuenta / RFC</label>
                        <input 
                            type="text" 
                            name="noCuentaRFC"
                            class="form-control"
                            minlength="9"
                            maxlength="13"
                            required
                        >
                        <div class="form-text">Debe tener entre 9 y 13 caracteres.</div>
                    </div>

                    <!-- NOMBRE -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre</label>
                        <input 
                            type="text"
                            name="nombre"
                            class="form-control"
                            minlength="3"
                            maxlength="120"
                            required
                        >
                    </div>

                    <!-- APELLIDO MATERNO (OBLIGATORIO) -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Apellido Materno</label>
                        <input 
                            type="text"
                            name="apellidoMaterno"
                            class="form-control"
                            minlength="3"
                            maxlength="120"
                            required
                        >
                    </div>

                    <!-- APELLIDO PATERNO -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Apellido Paterno</label>
                        <input 
                            type="text"
                            name="apellidoPaterno"
                            class="form-control"
                            minlength="3"
                            maxlength="120"
                            required
                        >
                    </div>

                    <!-- EMAIL -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input 
                            type="email"
                            name="email"
                            class="form-control"
                            maxlength="120"
                            required
                        >
                        <div class="form-text">Correo válido</div>
                    </div>

                    <!-- ROL -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Rol</label>
                        <select 
                            name="rolId"
                            class="form-select"
                            required
                        >
                            <option value="" disabled selected>Selecciona un rol</option>
                            <option value="1">Alumno</option>
                            <option value="2">Profesor</option>
                            <option value="3">Servicio Social</option>
                            <option value="4">Administrador</option>
                            <option value="5">Becario</option>
                            <option value="6">Visitante</option>
                        </select>
                    </div>

                    <!-- CARRERA -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-primary">Carrera</label>

                        <div class="input-group shadow-sm rounded-3">
                            <span class="input-group-text bg-primary text-white">
                                <i class="bi bi-mortarboard"></i>
                            </span>

                            <select id="carreraId" name="carreraId"
                                    class="form-select border-start-0"
                                    required
                                    hx-get="/api/carreras/options"
                                    hx-trigger="load"
                                    hx-target="#carreraId"
                                    hx-swap="innerHTML">

                                <option value="" disabled selected>
                                    <span class="text-muted">Cargando carreras...</span>
                                </option>

                            </select>
                        </div>

                        <small class="form-text text-muted">
                            Selecciona la carrera correspondiente.
                        </small>
                    </div>


                    <button type="submit" class="btn btn-custom-primary w-100 py-2">
                        Guardar Visitante
                    </button>
                    <button 
                    type="button"
                        class="btn btn-secondary w-100 py-2 mt-2"
                        hx-get="/pantallas/visitas/editar"
                        hx-target="#main-content"
                        hx-swap="innerHTML">
                        Volver
                    </button>

                </form>
            </div>

        </div>
    </div>
</div>
