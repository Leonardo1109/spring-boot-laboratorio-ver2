<div class="container-fluid">
    <div class="row">
        <div class="col-12">

            <div class="card shadow-sm p-4">

                <h2 class="mb-4">Editar Visita</h2>

                <!-- BUSCADOR -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Buscar por Numero de Cuenta o RFC</label>
                    <input 
                        type="text" 
                        class="form-control"
                        placeholder="Escribe para buscar..."
                        hx-get="/pantallas/visitas/buscar"
                        hx-trigger="keyup changed delay:300ms"
                        hx-target="#resultados"
                        hx-include="[name='search']"
                        name="search"
                    >
                </div>

                <!-- RESULTADOS -->
                <div id="resultados"></div>

                <!-- EQUIPOS RECIENTES -->
                <h5 class="mt-4 mb-3">Últimas Visitas registradas</h5>

                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Numero de cuenta | RFC</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Carrera</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <th:block th:each="v : ${visitasRecientes}">
                            <tr>
                                <td>[[${v.id}]]</td>
                                <td>[[${v.noCuentaRFC}]]</td>
                                <td>[[${v.email}]]</td>
                                <td>[[${v.rol.descripcion}]]</td>
                                <td>[[${v.carrera.nombre}]]</td>
                                <td>
                                    <button 
                                        class="btn btn-primary btn-sm"
                                        th:hx-get="@{/pantallas/visitas/form-editar(id=${v.id})}"
                                        hx-target="#form-editar"
                                        hx-swap="innerHTML">
                                        Editar
                                    </button>
                                </td>
                            </tr>
                        </th:block>
                    </tbody>
                </table>

                <!-- FORMULARIO DE EDICIÓN (VACÍO AL INICIO) -->
                <div id="form-editar"></div>

            </div>
        </div>
    </div>
</div>
