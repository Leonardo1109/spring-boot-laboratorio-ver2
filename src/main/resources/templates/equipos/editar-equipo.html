<div class="container-fluid">
    <div class="row">
        <div class="col-12">

            <div class="card shadow-sm p-4">

                <h2 class="mb-4">Editar Equipo</h2>

                <!-- BUSCADOR -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Buscar por descripcion</label>
                    <input 
                        type="text" 
                        class="form-control"
                        placeholder="Escribe para buscar..."
                        hx-get="/pantallas/equipos/buscar"
                        hx-trigger="keyup changed delay:300ms"
                        hx-target="#resultados"
                        hx-include="[name='search']"
                        name="search"
                    >
                </div>

                <!-- RESULTADOS -->
                <div id="resultados"></div>

                <!-- EQUIPOS RECIENTES -->
                <h5 class="mt-4 mb-3">Últimos equipos registrados</h5>

                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Descripción</th>
                            <th>Ubicación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <th:block th:each="e : ${equiposRecientes}">
                            <tr>
                                <td>[[${e.id}]]</td>
                                <td>[[${e.descripcion}]]</td>
                                <td>[[${e.ubicacion}]]</td>
                                <td>
                                    <button 
                                        class="btn btn-primary btn-sm"
                                        th:hx-get="@{/pantallas/equipos/form-editar(id=${e.id})}"
                                        hx-target="#form-editar"
                                        hx-swap="innerHTML">
                                        Editar
                                    </button>
                                </td>
                            </tr>
                        </th:block>
                    </tbody>
                </table>

                <!-- FORMULARIO DE EDICIÓN (VACÍO AL INICIO) -->
                <div id="form-editar"></div>

            </div>
        </div>
    </div>
</div>
