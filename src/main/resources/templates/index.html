<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pantalla de Inicio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
        body {
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            height: 100vh;
            width: 250px;
        }
        #main-content {
            padding: 20px;
            overflow-y: auto;
            height: 100vh;
        }
    </style>
</head>

<body>

<div class="d-flex">

    <!-- MENU LATERAL -->
    <div id="sidebar" class="bg-dark text-white p-3 d-flex flex-column">
        <h4 class="mb-4">Mi Panel</h4>

        <button class="btn btn-outline-light mb-2"
                hx-get="/pantallas/inicio"
                hx-target="#main-content"
                hx-swap="innerHTML">
            Inicio
        </button>

        <button class="btn btn-outline-light mb-2"
                hx-get="/pantallas/asistencias/principal"
                hx-target="#main-content"
                hx-swap="innerHTML">
            Asistencias
        </button>

        <button class="btn btn-outline-light mb-2"
                hx-get="/pantallas/equipos/crear"
                hx-target="#main-content"
                hx-swap="innerHTML">
            Crear Equipo
        </button>

        <button class="btn btn-outline-light mb-2"
                hx-get="/pantallas/equipos/editar"
                hx-target="#main-content"
                hx-swap="innerHTML">
            Editar Equipo
        </button>

        <!--
        <a href="/api/equipos" target="_blank" class="btn btn-outline-light mb-2">
            Equipo JSON
        </a>
        -->

        <button class="btn btn-outline-light mb-2"
                hx-get="/pantallas/proyectos/crear"
                hx-target="#main-content"
                hx-swap="innerHTML">
            Crear Proyecto
        </button>

        <button class="btn btn-outline-light mb-2"
                hx-get="/pantallas/proyectos/editar"
                hx-target="#main-content"
                hx-swap="innerHTML">
            Editar Proyecto
        </button>

        <!--
        <a href="/api/proyectos" target="_blank" class="btn btn-outline-light mb-2">
            Proyecto JSON
        </a>
        

        <a href="/api/asistencias" target="_blank" class="btn btn-outline-light mb-2">
            Asistencia JSON
        </a>
        -->

        <button class="btn btn-outline-light mb-2"
                hx-get="/pantallas/visitas/crear"
                hx-target="#main-content"
                hx-swap="innerHTML">
            Crear Visita
        </button>

        <button class="btn btn-outline-light mb-2"
                hx-get="/pantallas/visitas/editar"
                hx-target="#main-content"
                hx-swap="innerHTML">
            Editar Visita
        </button>

        <!--
        <a href="/api/visitas" target="_blank" class="btn btn-outline-light mb-2">
            Visita JSON
        </a>
        -->
        
        <button class="btn btn-outline-light mb-2">Cerrar sesión</button>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="main-content" class="bg-light flex-grow-1">
        <h2>Bienvenido al Proyecto Laboratorio Big Data de la FES Aragon</h2>
        <h2>de la carrera de Ingenieria en Computacion</h2>
        <br>
        <p>Creado por el Ingeniero Leonardo Olvera Martinez</p>
        <p>Selecciona una opción del menú lateral.</p>
    </div>

</div>

</body>
</html>

<!-- Script para asistencias -->
<script>
    class EquiposPage {
        // Carga el JSON y lo pinta
        static cargar() {
            fetch('/api/equipos')
                .then(r => r.json())
                .then(data => {
                    console.log('Datos recibidos de la API:', data);
                    this.renderizarPorEstado(data);
                })
                .catch(err => {
                    console.error('Error al cargar equipos', err);
                });
        }

        static estilosPorEstatus = {
            1: { badge: 'bg-success', label: 'Disponible', border: 'success'},
            2: { badge: 'bg-primary', label: 'En uso',  border: 'primary'},
            3: { badge: 'bg-warning text-dark', label: 'Reservado',  border: 'warning' },
            4: { badge: 'bg-danger', label: 'Fuera de servicio', border: 'danger' },
            5: { badge: 'bg-info text-dark', label: 'En mantenimiento', border: 'info' }
        };


        // Renderiza los equipos en listas según su estado
        static renderizarPorEstado(equipos) {
            // Diccionario con id_estatus → id de UL
            const estadosMap = {
                1: 'equipos-disponible',
                2: 'equipos-en-uso',
                3: 'equipos-reservado',
                4: 'equipos-fuera-servicio',
                5: 'equipos-en-mantenimiento'
            };

            // Limpiar todas las listas
            Object.values(estadosMap).forEach(id => {
                const ul = document.getElementById(id);
                if (ul) ul.innerHTML = '';
            });
            

            // Recorrer cada equipo y agregarlo a la lista correspondiente
            equipos.forEach(e => {
                const ulId = estadosMap[e.estatus.id];
                const ul = document.getElementById(ulId);
                if (!ul) return;

                const ruta = this.obtenerRutaPorEstatus(e.estatus.id, e.id);
                
                const estilo = this.estilosPorEstatus[e.estatus.id];

                const card = document.createElement('div');
                card.className = 'col-md-6 col-lg-4';

                // <div class="card shadow-sm h-100 border-${estilo.border} border-2">
                card.innerHTML = `
                    <div class="card shadow-sm h-100">
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="card-title mb-0">Equipo #${e.id}</h6>
                                <span class="badge ${estilo.badge}">
                                    ${estilo.label}
                                </span>
                            </div>

                            <p class="small mb-1"><strong>Código:</strong> ${e.codigoInventario}</p>
                            <p class="small mb-1"><strong>Descripción:</strong> ${e.descripcion}</p>
                            <p class="small mb-1"><strong>Ubicación:</strong> ${e.ubicacion}</p>
                            <p class="small mb-3"><strong>Tipo:</strong> ${e.tipoEquipo.descripcion}</p>

                            <div class="mt-auto text-end">
                                <button 
                                    class="btn btn-outline-primary btn-sm"
                                    hx-get="${ruta}" 
                                    hx-target="#main-content"
                                    hx-swap="innerHTML">
                                    Ver equipo
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                ul.appendChild(card);
                htmx.process(card);

            });
        }

        static obtenerRutaPorEstatus(estatusId, equipoId) {
            if (estatusId >= 1 && estatusId <= 3) {
                return `/pantallas/asistencias/registrar?id=${equipoId}`;
            }
            if (estatusId === 4 || estatusId === 5) {
                return `/pantallas/asistencias/cambiar-estado?id=${equipoId}`;
            }
            return '#';
        }

    }



    // Detecta cuando HTMX swapea la pantalla
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.target.id === 'main-content') {
            if (evt.target.querySelector('[data-page="equipos"]')) {
                EquiposPage.cargar();
            }
        }
    });
</script>
