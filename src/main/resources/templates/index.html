<!DOCTYPE html>
<html lang="es"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Pantalla de Inicio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
        body {
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            /*height: 100vh;*/
            width: 250px;
            flex-shrink: 0;
        }
        #main-content {
            padding: 20px;
            overflow-y: auto;
            /*height: 100vh;*/
            flex: 1;
        }
    </style>
</head>

<body>

<div class="d-flex vh-100">

    <!-- MENU LATERAL -->
    <div id="sidebar" class="bg-dark text-white p-3 d-flex flex-column">
        <h4 class="mb-4">Mi Panel</h4>

        <button class="btn btn-outline-light mb-2"
                hx-get="/pantallas/inicio"
                hx-target="#main-content"
                hx-swap="innerHTML">
            Inicio
        </button>

        <button class="btn btn-outline-light mb-2"
                hx-get="/pantallas/asistencias/principal"
                hx-target="#main-content"
                hx-swap="innerHTML">
            Asistencias
        </button>

        <div sec:authorize="hasRole('ADMIN')">
            <button class="btn btn-outline-light mb-2 w-100"
                    hx-get="/pantallas/equipos/crear"
                    hx-target="#main-content"
                    hx-swap="innerHTML">
                Crear Equipo
            </button>

            <button class="btn btn-outline-light mb-2 w-100"
                    hx-get="/pantallas/equipos/editar"
                    hx-target="#main-content"
                    hx-swap="innerHTML">
                Editar Equipo
            </button>
        </div>

        <!--
        <a href="/api/equipos" target="_blank" class="btn btn-outline-light mb-2">
            Equipo JSON
        </a>
        -->

        <div sec:authorize="hasRole('ADMIN')">
            <button class="btn btn-outline-light mb-2 w-100"
                    hx-get="/pantallas/proyectos/crear"
                    hx-target="#main-content"
                    hx-swap="innerHTML">
                Crear Proyecto
            </button>

            <button class="btn btn-outline-light mb-2 w-100"
                    hx-get="/pantallas/proyectos/editar"
                    hx-target="#main-content"
                    hx-swap="innerHTML">
                Editar Proyecto
            </button>
        </div>

        <!--
        <a href="/api/proyectos" target="_blank" class="btn btn-outline-light mb-2">
            Proyecto JSON
        </a>
        

        <a href="/api/asistencias" target="_blank" class="btn btn-outline-light mb-2">
            Asistencia JSON
        </a>
        -->

        <div sec:authorize="hasRole('ADMIN')">
            <button class="btn btn-outline-light mb-2 w-100"
                    hx-get="/pantallas/visitas/crear"
                    hx-target="#main-content"
                    hx-swap="innerHTML">
                Crear Visita
            </button>

            <button class="btn btn-outline-light mb-2 w-100"
                    hx-get="/pantallas/visitas/editar"
                    hx-target="#main-content"
                    hx-swap="innerHTML">
                Editar Visita
            </button>
        </div>

        <!--
        <a href="/api/visitas" target="_blank" class="btn btn-outline-light mb-2">
            Visita JSON
        </a>
        -->
        
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light mb-2 w-100">
                Cerrar sesión
            </button>
        </form>        
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="main-content" class="bg-light">
        <h2>Bienvenido al Proyecto Laboratorio Big Data de la FES Aragon</h2>
        <h2>de la carrera de Ingenieria en Computacion</h2>
        <br>
        <p>Creado por el Ingeniero Leonardo Olvera Martinez</p>
        <p>Selecciona una opción del menú lateral.</p>
    </div>

</div>

</body>
</html>

<!-- Script para asistencias -->
<script>
    class EquiposPage {
        // Carga el JSON y lo pinta
        static cargar() {
            fetch('/api/equipos')
                .then(r => r.json())
                .then(data => {
                    console.log('Datos recibidos de la API:', data);
                    this.renderizarPorEstado(data);
                })
                .catch(err => {
                    console.error('Error al cargar equipos', err);
                });
        }

        static estilosPorEstatus = {
            1: { badge: 'bg-success', label: 'Disponible', border: 'success'},
            2: { badge: 'bg-primary', label: 'En uso',  border: 'primary'},
            3: { badge: 'bg-warning text-dark', label: 'Reservado',  border: 'warning' },
            4: { badge: 'bg-danger', label: 'Fuera de servicio', border: 'danger' },
            5: { badge: 'bg-info text-dark', label: 'En mantenimiento', border: 'info' }
        };


        // Renderiza los equipos en listas según su estado
        static renderizarPorEstado(equipos) {
            // Diccionario con id_estatus → id de UL
            const estadosMap = {
                1: 'equipos-disponible',
                2: 'equipos-en-uso',
                3: 'equipos-reservado',
                4: 'equipos-fuera-servicio',
                5: 'equipos-en-mantenimiento'
            };

            // Limpiar todas las listas
            Object.values(estadosMap).forEach(id => {
                const ul = document.getElementById(id);
                if (ul) ul.innerHTML = '';
            });
            

            // Recorrer cada equipo y agregarlo a la lista correspondiente
            equipos.forEach(e => {
                const ulId = estadosMap[e.estatus.id];
                const ul = document.getElementById(ulId);
                if (!ul) return;

                const ruta = this.obtenerRutaPorEstatus(e.estatus.id, e.id);
                
                const estilo = this.estilosPorEstatus[e.estatus.id];

                const card = document.createElement('div');
                card.className = 'col-md-6 col-lg-4';

                // <div class="card shadow-sm h-100 border-${estilo.border} border-2">
                card.innerHTML = `
                    <div class="card shadow-sm h-100">
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="card-title mb-0">Equipo #${e.id}</h6>
                                <span class="badge ${estilo.badge}">
                                    ${estilo.label}
                                </span>
                            </div>

                            <p class="small mb-1"><strong>Código:</strong> ${e.codigoInventario}</p>
                            <p class="small mb-1"><strong>Descripción:</strong> ${e.descripcion}</p>
                            <p class="small mb-1"><strong>Ubicación:</strong> ${e.ubicacion}</p>
                            <p class="small mb-3"><strong>Tipo:</strong> ${e.tipoEquipo.descripcion}</p>

                            <div class="mt-auto text-end">
                                <button 
                                    class="btn btn-outline-primary btn-sm"
                                    hx-get="${ruta}" 
                                    hx-target="#main-content"
                                    hx-swap="innerHTML">
                                    Ver equipo
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                ul.appendChild(card);
                htmx.process(card);

            });
        }

        static obtenerRutaPorEstatus(estatusId, equipoId) {
            if (estatusId >= 1 && estatusId <= 3) {
                return `/pantallas/asistencias/registrar?id=${equipoId}`;
            }
            if (estatusId === 4 || estatusId === 5) {
                return `/pantallas/asistencias/cambiar-estado?id=${equipoId}`;
            }
            return '#';
        }

    }

    class AsistenciaActivaPage {

        static cargar() {
            const root = document.querySelector('[data-page="asistencia-activa"]');
            if (!root) return;

            const equipoId = this.obtenerEquipoId();
            if (!equipoId) {
                console.warn('No se encontró id de equipo en la URL');
                return;
            }

            this.cargarAsistenciaActiva(equipoId);
        }

        static obtenerEquipoId() {
            const root = document.querySelector('[data-page="asistencia-activa"]');
            return root?.dataset.equipoId ?? null;
        }

        static cargarAsistenciaActiva(equipoId) {
            fetch(`/api/asistencias/equipo/${equipoId}/activa`)
                .then(async r => {
                    if (r.status === 204) return null;
                    if (!r.ok) throw new Error('Error HTTP ' + r.status);
                    return r.json();
                })
                .then(data => {
                    this.renderizarAsistencia(data, equipoId);
                })
                .catch(err => {
                    console.error('Error cargando asistencia activa', err);
                    this.asistenciaActual = null;
                    this.renderizarFormulario(null, equipoId);
                });
        }

        static renderizarAsistencia(a, equipoId) {
            this.asistenciaActual = a ?? null;
            this.renderHoras(a);
            this.renderDashboardVisita(a);
            this.renderDashboardProyecto(a);
            this.renderFormulario(a, equipoId);
        }

        static renderHoras(a) {
            const cont = document.getElementById('asistencia-horas');
            if (!cont) return;

            const entrada = a?.horaEntrada ?? '';
            const salida = a?.horaSalida ?? '';
            const estatusActual = a?.equipo?.estatus?.id ?? '';
            const sinAsistencia = !a;

            cont.innerHTML = `
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Horario</h5>

                        <div class="row">
                            <div class="col">
                                <label class="form-label">Hora de entrada</label>
                                <input type="datetime-local" class="form-control"
                                    value="${this.toInputDate(entrada)}"
                                    ${estatusActual === 2 ? 'readonly' : ''}>
                            </div>

                            <div class="col">
                                <label class="form-label">Hora de salida</label>
                                <input type="datetime-local" class="form-control"
                                    value="${this.toInputDate(salida)}"
                                    ${!a ? 'readonly' : ''}>
                                <p>Estatus actual: ${estatusActual ?? 'sin asistencia'}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        static renderDashboardVisita(a) {
            const cont = document.getElementById('dashboard-visita');
            if (!cont) return;

            const visita = a?.visita;
            if (!visita) {
                cont.innerHTML = `<p class="text-muted">Sin visita asignada</p>`;
                return;
            }

            cont.innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Visita actual</h5>
                        <p><strong>Nombre:</strong> ${visita.nombre} ${visita.apellidoPaterno} ${visita.apellidoMaterno}</p>
                        <p><strong>Numero de cuenta o RFC:</strong> ${visita.noCuentaRFC}</p>
                        <p>Id visita ${visita.id}</p>
                    </div>
                </div>
            `;
        }

        static onVisitaSeleccionada(visitaId) {
            fetch(`/api/visitas/${visitaId}`)
                .then(r => r.json())
                .then(visita => {
                    this.visitaSeleccionada = visita;

                    this.renderDashboardVisita({ visita });

                    const input = document.querySelector('input[name="visitaId"]');
                    if (input) input.value = visita.id;
                })
                .catch(err => console.error('Error cargando visita', err));
        }

        static renderDashboardProyecto(a) {
            const cont = document.getElementById('dashboard-proyecto');
            if (!cont) return;

            const act = a?.actividad;
            if (!act) {
                cont.innerHTML = `<p class="text-muted">Sin actividad seleccionada</p>`;
                return;
            }

            cont.innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Actividad seleccionada</h5>
                        <p><strong>Descripción:</strong> ${act.descripcion}</p>
                        <p><strong>Horas:</strong> ${act.horas}</p>
                    </div>
                </div>
            `;
        }

        static onProyectoSeleccionado(proyectoId) {
            fetch(`/api/proyectos/${proyectoId}`)
                .then(r => r.json())
                .then(proyecto => {
                    this.proyectoSeleccionado = proyecto;
                    this.actividadSeleccionada = null;

                    this.renderSelectorActividades(proyecto.actividades);
                    this.renderDashboardProyecto(null);

                    const inputProyecto = document.querySelector('input[name="proyectoId"]');
                    if (inputProyecto) inputProyecto.value = proyecto.id;
                })
                .catch(err => console.error('Error cargando proyecto', err));
        }

        static renderSelectorActividades(actividades) {
            const cont = document.getElementById('selector-actividad');
            if (!cont) return;

            if (!actividades || actividades.length === 0) {
                cont.innerHTML = `<p class="text-muted">Proyecto sin actividades</p>`;
                return;
            }

            cont.innerHTML = `
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Seleccionar actividad</h5>

                        <select id="actividad-select" class="form-select">
                            <option value="">-- Selecciona una actividad --</option>
                            ${actividades.map(a => `
                                <option value="${a.id}">
                                    ${a.descripcion} (${a.horas} h)
                                </option>
                            `).join('')}
                        </select>
                    </div>
                </div>
            `;

            document
                .getElementById('actividad-select')
                .addEventListener('change', e => {
                    const actId = e.target.value;
                    if (!actId) return;

                    const act = actividades.find(a => a.id == actId);
                    this.onActividadSeleccionada(act);
                });
        }

        static onActividadSeleccionada(actividad) {
            this.actividadSeleccionada = actividad;

            this.renderDashboardProyecto({ actividad });

            const input = document.querySelector('input[name="actividadId"]');
            if (input) input.value = actividad.id;
        }

        static renderFormulario(a, equipoId) {
            const cont = document.getElementById('asistencia-form');
            if (!cont) return;

            const observacion = a?.observacion ?? '';
            const estatusActual = a?.equipo?.estatus?.id ?? 1;

            console.log("Estatus actual: ", estatusActual);

            const transiciones = {
                1: [2, 3], // Disponible -> En uso, Reservado
                2: [1],    // En uso -> Disponible
                3: [2]     // Reservado -> En uso
            };

            const estados = {
                1: 'Disponible',
                2: 'En uso',
                3: 'Reservado'
            };

            const estadosPermitidos = transiciones[estatusActual] ?? [];

            // Generar options dinámicamente
            const optionsHTML = estadosPermitidos.map(id => `
                <option value="${id}">
                    ${estados[id]}
                </option>
            `).join('');

            const esDisponible = Number(estatusActual) === 1;

            const botonAccionHTML = esDisponible
                ? `<button type="button" id="btn-accion-secundaria"
                    class="btn btn-secondary w-100">
                        Volver
                </button>`
                : `<button type="button" id="btn-accion-secundaria"
                    class="btn btn-danger w-100">
                        Eliminar asistencia
                </button>`;


            cont.innerHTML = `
                <form id="form-asistencia" class="card shadow-sm">
                    <input type="hidden" name="visitaId" value="${a?.visita?.id ?? ''}">
                    <input type="hidden" name="proyectoId" value="${a?.proyecto?.id ?? ''}">
                    <input type="hidden" name="actividadId" value="${a?.actividad?.id ?? ''}">


                    <div class="card-body">
                        <h5 class="card-title">Guardar asistencia</h5>

                        <input type="hidden" name="equipoId" value="${equipoId}">

                        <div class="mb-3">
                            <label class="form-label">Observaciones</label>
                            <textarea name="observacion"
                                class="form-control">${observacion}</textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Estatus del equipo</label>
                            <select name="estatusEquipo" class="form-select">
                                ${optionsHTML}
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-2">
                            Guardar asistencia
                        </button>

                        ${botonAccionHTML}

                    </div>
                </form>
            `;

            document
                .getElementById('form-asistencia')
                .addEventListener('submit', e => {
                    e.preventDefault();
                    this.guardarAsistencia();
                });
                document
                    .getElementById('btn-accion-secundaria')
                    ?.addEventListener('click', () => {

                        if (esDisponible) {
                            htmx.ajax('GET',
                                '/pantallas/asistencias/principal',
                                { target: '#main-content', swap: 'innerHTML' }
                            );
                            return;
                        }
                        
                        const asistenciaId = this.asistenciaActual?.id;
                        if (!asistenciaId) return;

                        fetch(`/api/asistencias/${asistenciaId}`, {
                            method: 'DELETE'
                        })
                        .then(r => {
                            if (!r.ok) throw new Error('Error eliminando asistencia');
                            return fetch(
                                `/api/equipos/estatus?equipoId=${equipoId}&estatusId=1`, 
                                { method: 'PATCH' }
                            );
                        })
                        .then(r => {
                            if (!r.ok) throw new Error('Error actualizando estatus del equipo');
                        })
                        .then(() => {
                            return htmx.ajax('GET',
                                '/pantallas/asistencias/principal',
                                { target: '#main-content', swap: 'innerHTML' }
                            );
                        })
                        .catch(err => console.error(err));
                    });

        }

        static toInputDate(iso) {
            if (!iso) return '';
            return iso.substring(0, 16);
        }

        static guardarAsistencia() {

            const inputsHora = document.querySelectorAll(
                '#asistencia-horas input[type="datetime-local"]'
            );

            const estatusEquipo = Number(
                document.querySelector('[name="estatusEquipo"]')?.value
            );


            const dto = {
                horaEntrada: inputsHora[0]?.value || null,
                horaSalida: inputsHora[1]?.value || null,
                observacion: document.querySelector('[name="observacion"]').value,
                visitaId: Number(document.querySelector('[name="visitaId"]').value),
                equipoId: Number(document.querySelector('[name="equipoId"]').value),
                actividadId: Number(document.querySelector('[name="actividadId"]').value)
            };

            const asistenciaId = this.asistenciaActual?.id;

            const method = asistenciaId ? 'PUT' : 'POST';
            const url = asistenciaId
                ? `/api/asistencias/${asistenciaId}`
                : `/api/asistencias`;

            fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dto)
            })
            .then(r => {
                if (!r.ok) throw new Error('Error guardando asistencia');
                return r.json();
            })
            .then(a => {
                this.asistenciaActual = a;

                return fetch(
                    `/api/equipos/estatus?equipoId=${dto.equipoId}&estatusId=${estatusEquipo}`,
                    { method: 'PATCH' }
                );
            })
            .then(() => {
                htmx.ajax('GET',
                    '/pantallas/asistencias/principal',
                    { target: '#main-content', swap: 'innerHTML' }
                );
            })

            .catch(err => console.error(err));
            }
    }

    // Detecta cuando HTMX swapea la pantalla
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.target.id === 'main-content') {
            if (evt.target.querySelector('[data-page="equipos"]')) {
                EquiposPage.cargar();
            }
            if (evt.target.querySelector('[data-page="asistencia-activa"]')) {
               AsistenciaActivaPage.cargar();
            }
        }
    });

    document.addEventListener('click', function (e) {
        const btn = e.target.closest('button[hx-get*="/pantallas/visitas/"]');
        if (!btn) return;

        const url = btn.getAttribute('hx-get');
        const params = new URLSearchParams(url.split('?')[1]);
        const visitaId = params.get('id');

        if (!visitaId) return;

        if (!document.querySelector('[data-page="asistencia-activa"]')) return;

        AsistenciaActivaPage.onVisitaSeleccionada(visitaId);
    });

    // evento escucha para proyecto/actividad
    document.addEventListener('click', function (e) {
        // const btn = e.target.closest('button[hx-get*="/pantallas/proyectos/"]');
        const btn = e.target.closest('[hx-get*="/pantallas/proyectos/"]');

        if (!btn) return;

        if (!document.querySelector('[data-page="asistencia-activa"]')) return;

        const url = btn.getAttribute('hx-get');
        const params = new URLSearchParams(url.split('?')[1]);
        const proyectoId = params.get('id');

        if (!proyectoId) return;

        e.preventDefault();
        e.stopPropagation();

        AsistenciaActivaPage.onProyectoSeleccionado(proyectoId);
    });

</script>
