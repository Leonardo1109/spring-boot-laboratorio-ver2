<div class="container-fluid">
    <div class="row">
        <div class="col-12">

            <div class="card shadow-sm p-4">

                <h2 class="mb-4">Editar Proyecto</h2>

                <!-- BUSCADOR -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Buscar por Clave</label>
                    <input 
                        type="text" 
                        class="form-control"
                        placeholder="Escribe para buscar..."
                        hx-get="/pantallas/proyectos/buscar"
                        hx-trigger="keyup changed delay:300ms"
                        hx-target="#resultados"
                        hx-include="[name='search']"
                        name="search"
                    >
                </div>

                <!-- RESULTADOS -->
                <div id="resultados"></div>

                <!-- EQUIPOS RECIENTES -->
                <h5 class="mt-4 mb-3">Últimos Proyectos registrados</h5>

                <div class="table-responsive">
                    <table class="table table-striped table-bordered tabla-ajustada">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Clave</th>
                                <th>Nombre</th>
                                <th>Responsables</th>
                                <th>Carreras</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <th:block th:each="p : ${proyectosRecientes}">
                                <tr>
                                    <td>[[${p.id}]]</td>
                                    <td>[[${p.clave}]]</td>
                                    <td>[[${p.nombre}]]</td>
                                    <td class="celda-scroll">
                                        <span th:each="v : ${p.visitas}"
                                              class="badge bg-primary me-1">
                                            [[${v.nombre}]] - [[${v.noCuentaRFC}]]
                                        </span>
                                    </td>
                                    <td class="celda-scroll">
                                        <span th:each="c : ${p.carreras}"
                                              class="badge bg-dark me-1">
                                            [[${c.nombre}]]
                                        </span>
                                    </td>
                                    <td>
                                        <button 
                                            class="btn btn-primary btn-sm"
                                            th:hx-get="@{/pantallas/proyectos/form-editar(id=${p.id})}"
                                            hx-target="#form-editar"
                                            hx-swap="innerHTML">
                                            Editar
                                        </button>
                                    </td>
                                </tr>
                            </th:block>
                        </tbody>
                    </table>
                </div>

                <!-- FORMULARIO DE EDICIÓN (VACÍO AL INICIO) -->
                <div id="form-editar"></div>

            </div>
        </div>
    </div>
</div>


<style>
    .tabla-ajustada td {
        white-space: normal !important;
        word-wrap: break-word;
        max-width: 250px;
    }

    .celda-scroll {
        max-height: 90px;
        overflow-y: auto;
    }
</style>
